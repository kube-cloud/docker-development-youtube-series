apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-application
  labels:
    app: dotnet-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-application
  template:
    metadata:
      labels:
        app: dotnet-application
    spec:
      initContainers:
      - name: set-sysctl
        image: busybox
        command: ["sh", "-c", "echo 524288 > /proc/sys/fs/inotify/max_user_watches; echo 512 > /proc/sys/fs/inotify/max_user_instances"]
        securityContext:
          privileged: true
      containers:
      - name: dotnet-application
        image: dotnet-application:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-application
  labels:
    app: dotnet-application
spec:
  selector:
    app: dotnet-application
  ports:
  - port: 80
    name: http
    targetPort: 5000
  type: ClusterIP
